name: CI

on:
  pull_request:
  push:
    branches: [main, 'fix/security-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-bun-pinned

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun x --no-install eslint .

      - name: Typecheck
        run: bun x --no-install tsc --noEmit

      - name: Build current source before production consumer tests
        run: bun run rebuild

      - name: Test
        run: bun test
